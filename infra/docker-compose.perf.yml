services:
  db:
    image: mysql:8.0
    container_name: eventitta-perf-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${PERF_DB_NAME:-eventitta_perf}
      MYSQL_USER: ${PERF_DB_USER:-eventittaUser}
      MYSQL_PASSWORD: ${PERF_DB_PASSWORD:-eventittaPass}
      MYSQL_ROOT_PASSWORD: ${PERF_DB_ROOT_PASSWORD:-eventittaRootPass}
    ports:
      - "${PERF_DB_PORT:-13306}:3306"
    volumes:
      - perf-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${PERF_DB_ROOT_PASSWORD:-eventittaRootPass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    cpus: 2
    mem_limit: 2g
    networks:
      - perf-network

  redis:
    image: redis:7-alpine
    container_name: eventitta-perf-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${PERF_REDIS_PORT:-16379}:6379"
    volumes:
      - perf-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    cpus: 0.5
    mem_limit: 512m
    networks:
      - perf-network

  mock-services:
    build:
      context: ..
      dockerfile: infra/mock-services/Dockerfile
    container_name: eventitta-perf-mock-services
    restart: unless-stopped
    environment:
      MOCK_NATIONAL_STATUS: ${MOCK_NATIONAL_STATUS:-200}
      MOCK_NATIONAL_DELAY_MS: ${MOCK_NATIONAL_DELAY_MS:-0}
      MOCK_SEOUL_STATUS: ${MOCK_SEOUL_STATUS:-200}
      MOCK_SEOUL_DELAY_MS: ${MOCK_SEOUL_DELAY_MS:-0}
      MOCK_GEOCODING_STATUS: ${MOCK_GEOCODING_STATUS:-200}
      MOCK_GEOCODING_DELAY_MS: ${MOCK_GEOCODING_DELAY_MS:-0}
    ports:
      - "${PERF_MOCK_PORT:-18090}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    cpus: 0.5
    mem_limit: 256m
    networks:
      - perf-network

  app-1:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: eventitta-perf-app-1
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: perf
      DB_NAME: ${PERF_DB_NAME:-eventitta_perf}
      JDBC_USERNAME: ${PERF_DB_USER:-eventittaUser}
      JDBC_PASSWORD: ${PERF_DB_PASSWORD:-eventittaPass}
      PERF_DB_HOST: db
      PERF_DB_PORT: 3306
      PERF_REDIS_HOST: redis
      PERF_REDIS_PORT: 6379
      PERF_NGINX_PORT: ${PERF_NGINX_PORT:-18080}
      PERF_SEOUL_BASE_URL: http://mock-services:8080/seoul
      PERF_NATIONAL_BASE_URL: http://mock-services:8080/national
      PERF_GEOCODING_BASE_URL: http://mock-services:8080/geocoding
      JWT_SECRET: ${PERF_JWT_SECRET:-perf-jwt-secret-change-me-32-byte-minimum}
      KAKAO_CLIENT_ID: ${PERF_KAKAO_CLIENT_ID:-perf-kakao-client-id}
      KAKAO_CLIENT_SECRET: ${PERF_KAKAO_CLIENT_SECRET:-perf-kakao-client-secret}
      MEDIA_CDN_BASE_URL: http://localhost:${PERF_NGINX_PORT:-18080}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-services:
        condition: service_healthy
    ports:
      - "${PERF_APP1_PORT:-18081}:8080"
    volumes:
      - perf-uploads:/app/uploads
    cpus: 2
    mem_limit: 2g
    networks:
      - perf-network

  app-2:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: eventitta-perf-app-2
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: perf
      DB_NAME: ${PERF_DB_NAME:-eventitta_perf}
      JDBC_USERNAME: ${PERF_DB_USER:-eventittaUser}
      JDBC_PASSWORD: ${PERF_DB_PASSWORD:-eventittaPass}
      PERF_DB_HOST: db
      PERF_DB_PORT: 3306
      PERF_REDIS_HOST: redis
      PERF_REDIS_PORT: 6379
      PERF_NGINX_PORT: ${PERF_NGINX_PORT:-18080}
      PERF_SEOUL_BASE_URL: http://mock-services:8080/seoul
      PERF_NATIONAL_BASE_URL: http://mock-services:8080/national
      PERF_GEOCODING_BASE_URL: http://mock-services:8080/geocoding
      JWT_SECRET: ${PERF_JWT_SECRET:-perf-jwt-secret-change-me-32-byte-minimum}
      KAKAO_CLIENT_ID: ${PERF_KAKAO_CLIENT_ID:-perf-kakao-client-id}
      KAKAO_CLIENT_SECRET: ${PERF_KAKAO_CLIENT_SECRET:-perf-kakao-client-secret}
      MEDIA_CDN_BASE_URL: http://localhost:${PERF_NGINX_PORT:-18080}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-services:
        condition: service_healthy
    ports:
      - "${PERF_APP2_PORT:-18082}:8080"
    volumes:
      - perf-uploads:/app/uploads
    cpus: 2
    mem_limit: 2g
    networks:
      - perf-network

  nginx:
    image: nginx:1.27-alpine
    container_name: eventitta-perf-nginx
    restart: unless-stopped
    depends_on:
      - app-1
      - app-2
    ports:
      - "${PERF_NGINX_PORT:-18080}:8080"
    volumes:
      - ./nginx/perf.conf:/etc/nginx/conf.d/default.conf:ro
    cpus: 0.25
    mem_limit: 128m
    networks:
      - perf-network

  influxdb:
    image: influxdb:1.8
    container_name: eventitta-perf-influxdb
    restart: unless-stopped
    ports:
      - "${INFLUX_HOST_PORT:-8086}:8086"
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    volumes:
      - perf-influxdb-data:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - perf-network

  grafana:
    image: grafana/grafana:latest
    container_name: eventitta-perf-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ""
    volumes:
      - perf-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - perf-network

volumes:
  perf-mysql-data:
  perf-redis-data:
  perf-uploads:
  perf-influxdb-data:
  perf-grafana-data:

networks:
  perf-network:
    driver: bridge
